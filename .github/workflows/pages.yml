name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static export (Pages base path)
        env:
          PAGES_BASE_PATH: /sod-eduplus-website
          NEXT_PUBLIC_SITE_URL: https://soddeveloper.github.io/sod-eduplus-website
          # Demo logins come only from repository secrets (unset = no login cards shown).
          NEXT_PUBLIC_DEMO_FULL_URL: ${{ secrets.DEMO_FULL_URL }}
          NEXT_PUBLIC_DEMO_FULL_USER: ${{ secrets.DEMO_FULL_USER }}
          NEXT_PUBLIC_DEMO_FULL_PASSWORD: ${{ secrets.DEMO_FULL_PASSWORD }}
          NEXT_PUBLIC_DEMO_LITE_URL: ${{ secrets.DEMO_LITE_URL }}
          NEXT_PUBLIC_DEMO_LITE_USER: ${{ secrets.DEMO_LITE_USER }}
          NEXT_PUBLIC_DEMO_LITE_PASSWORD: ${{ secrets.DEMO_LITE_PASSWORD }}
        run: npm run build
      - name: Check for forbidden terms
        run: "! grep -rIil odoo out"
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
